
name: Build Project Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract source ZIP
        run: |
          set -e
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Locate Gradle project
        run: |
          set -e
          SETTINGS=$(find extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)
          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

      - name: Generate Gradle wrapper
        run: |
          set -e
          cd "$PROJECT_DIR"

          VERSION=$(grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties \
            | sed 's/.*gradle-\([0-9.]*\)-.*/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not detect Gradle version."
            exit 1
          fi

          echo "Gradle version: $VERSION"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-${VERSION}/bin/gradle wrapper \
            --gradle-version "$VERSION" \
            --distribution-type bin

          chmod +x gradlew

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Final-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
