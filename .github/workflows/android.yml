
name: Build Project Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract source ZIP
        run: |
          set -e
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

      - name: Find Gradle project
        run: |
          set -e

          echo "Searching extracted files..."

          find extracted -maxdepth 5 -type f \
            \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          WRAPPER=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew wrapper exists in the ZIP."
            echo "The ZIP contents are:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle wrapper in: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Final-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
